spring.application.name=Knit_and_Sew
server.port=3026
server.servlet.context-path=/Knit_and_Sew

# MySQL DB config
spring.datasource.url=jdbc:mysql://localhost:3306/knit_sew_db?serverTimezone=Europe/Kiev&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# Locale
spring.web.locale=uk_UA
spring.web.locale-resolver=fixed

# Hibernate config

# 1) When I finish creating tables, change it to update and set "shouldWork" to true before first launch
# 2) When testing, set it to create. Also in TestDataRunner set shouldWork to false
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=INFO

# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Gemini Flash lite 2.5 API key

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash-lite