<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Knit&Sew - Магазин для рукоділля</title>
	<link type="image/x-icon" rel="shortcut icon" th:href="@{images/knit sew icon.png}">
	<!-- Підключення Tailwind CSS -->
	<script src="https://cdn.tailwindcss.com"></script>
	<!-- Підключення іконок Lucide -->
	<script src="https://unpkg.com/lucide@latest"></script>

	<!-- Налаштування кольорової палітри Tailwind -->
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						brand: {
							50: '#fdf2f8',
							100: '#fce7f3',
							500: '#ec6648', // Основний помаранчевий акцент
							600: '#dd571d',
							700: '#be1818',
						}
					}
				}
			}
		}
	</script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans text-gray-800">

<!-- Хедер -->
<header class="bg-white shadow-sm sticky top-0 z-50">
	<div class="container mx-auto px-4 py-4 flex justify-between items-center">
		<!-- Логотип -->
		<div th:replace="~{fragments/header.html :: logo}"></div>

		<!-- Навігація по сайту -->
		<nav class="hidden md:flex space-x-8">
			<a th:href="@{/}" class="text-brand-600 font-medium">Каталоги</a>
			<a th:href="@{/about-us}" class="text-gray-600 hover:text-brand-600 transition-colors">Про нас</a>
			<a th:href="@{/contacts}" class="text-gray-600 hover:text-brand-600 transition-colors">Контакти</a>
			<a th:href="@{/payment-delivery}" class="text-gray-600 hover:text-brand-600 transition-colors">Оплата і доставка</a>
		</nav>

		<!-- Іконки користувача -->
		<div th:replace="~{fragments/header.html :: user-cart-icon}"></div>
	</div>
</header>

<!-- Секція пошуку -->
<section class="bg-brand-50 py-16 md:py-18">
	<div class="container mx-auto px-4 text-center">
		<h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-6">Знайдіть все для вашого натхнення</h1>
		<p class="text-lg text-gray-600 mb-10 max-w-3xl mx-auto">Найбільший вибір пряжі, тканин та інструментів для втілення ваших творчих ідей.</p>

		<!-- Пошуковий рядок -->
		<!--TODO: implement search using simple word matching and AI searching-->
		<div class="max-w-3xl mx-auto relative group">
			<input type="text"
				   placeholder="Пошук товарів, категорій або артикулів..."
				   class="w-full pl-6 pr-16 py-4 rounded-full border border-gray-300 shadow-sm focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-100 text-lg transition-all">
			<button class="absolute right-3 top-1/2 transform -translate-y-1/2 bg-brand-500 text-white p-2 rounded-full hover:bg-brand-600 transition-colors">
				<i data-lucide="search" class="w-6 h-6"></i>
			</button>
		</div>
	</div>
</section>

<!-- Основний контент: Кореневі каталоги -->
<main class="flex-grow container mx-auto px-4 py-16">
	<h2 class="text-3xl font-bold text-center mb-12">Каталоги</h2>

	<!-- Сітка категорій -->
	<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">

		<!-- Картка, наприклад Пряжа -->
		<a th:each="category : ${catalogsRecords}"
		   th:href="@{/category/{catId}(catId=${category.id})}"
		   class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl border border-gray-100 transition-all duration-300 transform hover:-translate-y-1">

			<!-- Контейнер для зображення -->
			<div class="aspect-square bg-gray-100 flex items-center justify-center group-hover:bg-brand-50 transition-colors relative overflow-hidden">
				<!-- Якщо URL зображення є, виводимо його -->
				<img th:if="${category.imageUrl != null}"
					 th:src="@{${category.imageUrl}}"
					 th:alt="${category.name}"
					 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />

				<!-- Якщо зображення немає, ставимо заглушку -->
				<i th:unless="${category.imageUrl != null}"
				   data-lucide="image" class="w-16 h-16 text-gray-300 group-hover:text-brand-300 transition-colors"></i>

				<div class="absolute inset-0 bg-gradient-to-t from-black/10
				to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
			</div>

			<!-- Назва категорії -->
			<div class="p-6 text-center">
				<h3 class="text-xl font-semibold text-gray-800 group-hover:text-brand-600 transition-colors"
					th:text="${category.name}"></h3>
			</div>
		</a>

	</div>
</main>

<!-- Футер -->
<footer th:replace="~{fragments/footer :: footer-copy}"></footer>

<div th:replace="~{fragments/ai-modal.html :: ai-chat-modal}"></div>

<!-- Ініціалізація іконок -->
<script>
	lucide.createIcons();
</script>
<script th:src="@{/js/cart.js}"></script>
<script th:src="@{/js/ai-chat.js}"></script>
</body>
</html>
